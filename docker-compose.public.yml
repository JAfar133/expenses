# Публичный доступ к приложению с HTTPS. Подключается поверх основного файла:
#
#   docker compose -f docker-compose.yml -f docker-compose.public.yml up -d
#
# Что меняется:
#   - web слушает порты 80 и 443 на всех адресах (нужны для выдачи сертификата и для HTTPS);
#   - сайт защищён входом в самом приложении (логин и пароль пользователей), отдельного пароля Caddy на нём нет;
#   - pgAdmin доступен через тот же Caddy на отдельном адресе PGADMIN_ADDRESS (HTTPS, пароль Caddy
#     PGADMIN_BASIC_AUTH_* и собственный вход pgAdmin); его порт 5051 и порт PostgreSQL наружу не открыты.
services:
  web:
    volumes:
      - ./infra/Caddyfile.public:/etc/caddy/Caddyfile:ro
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Задайте SITE_ADDRESS в .env (домен или вид 1-2-3-4.nip.io)}
      PGADMIN_BASIC_AUTH_USER: ${PGADMIN_BASIC_AUTH_USER:?Задайте PGADMIN_BASIC_AUTH_USER в .env}
      PGADMIN_BASIC_AUTH_HASH: ${PGADMIN_BASIC_AUTH_HASH:?Задайте PGADMIN_BASIC_AUTH_HASH в .env (см. docs/DEPLOY.md)}
      PGADMIN_ADDRESS: ${PGADMIN_ADDRESS:?Задайте PGADMIN_ADDRESS в .env (например, pgadmin.1-2-3-4.nip.io)}
    ports: !override
      - "80:80"
      - "443:443"

  # На сервере без паролей пользователей запускаться нельзя: войти было бы некому
  backend:
    environment:
      AUTH_PASSWORD_MISHA: ${AUTH_PASSWORD_MISHA:?Задайте AUTH_PASSWORD_MISHA в .env (не короче 8 символов)}
      AUTH_PASSWORD_NASTYA: ${AUTH_PASSWORD_NASTYA:?Задайте AUTH_PASSWORD_NASTYA в .env (не короче 8 символов)}

  # pgAdmin стоит за прокси: пусть учитывает заголовки X-Forwarded-* (адрес, протокол HTTPS), которые добавляет Caddy
  pgadmin:
    environment:
      PGADMIN_CONFIG_PROXY_X_FOR_COUNT: "1"
      PGADMIN_CONFIG_PROXY_X_PROTO_COUNT: "1"
      PGADMIN_CONFIG_PROXY_X_HOST_COUNT: "1"
      PGADMIN_CONFIG_PROXY_X_PORT_COUNT: "1"
