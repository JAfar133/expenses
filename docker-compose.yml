# Expenses Tracker: PostgreSQL + backend (Fastify) + web (Caddy: static files and /api proxy).
#
#   cp .env.example .env              # and fill in the values
#   mkdir -p secrets && cp ~/.config/rclone/rclone.conf secrets/rclone.conf
#       (Excel in OneDrive is optional: without it create an empty file `touch secrets/rclone.conf`
#        and do not set ONEDRIVE_FILE_PATH; expenses will be stored in the database only)
#   docker compose up -d --build
#
# Database only for local development:  docker compose up -d --wait postgres pgadmin
# pgAdmin: http://127.0.0.1:5051 (login: PGADMIN_EMAIL / PGADMIN_PASSWORD from .env)
name: expenses-tracker

# Container logs: without a limit the json-file driver keeps them forever. Three files of 10 MB per container.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    # Memory cap: a leak restarts this container instead of exhausting the server
    mem_limit: 256m
    logging: *default-logging
    environment:
      POSTGRES_DB: expenses
      POSTGRES_USER: expenses
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в файле .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # The port is open on localhost only: needed to run the backend outside Docker (npm run dev).
    # Not 5432, to avoid conflicts with other Postgres instances on the computer.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expenses -d expenses"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    # Not started by `docker compose up -d` (it takes ~240 MB and is rarely needed). On the server:
    # ./scripts/pgadmin.sh on | off. Naming it explicitly (`docker compose up -d pgadmin`) also starts it.
    profiles: ["tools"]
    # Memory cap: a leak restarts this container instead of exhausting the server
    mem_limit: 384m
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Задайте PGADMIN_PASSWORD в файле .env}
      # Do not disable login: pgAdmin gives full access to the database
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./infra/pgadmin/servers.json:/pgadmin4/servers.json:ro
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5051}:80"

  backend:
    build:
      context: .
      dockerfile: infra/Dockerfile.backend
    restart: unless-stopped
    # Memory cap: a leak restarts this container instead of exhausting the server
    mem_limit: 256m
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      # The password is substituted into the URL as is: use letters and digits (openssl rand -hex 24)
      DATABASE_URL: postgres://expenses:${POSTGRES_PASSWORD}@postgres:5432/expenses
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Yerevan}
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-AMD}
      CURRENCIES: ${CURRENCIES:-AMD,RUB,USD,EUR}
      EXCHANGE_RATES_URL: ${EXCHANGE_RATES_URL:-https://cb.am/latest.json.php}
      EXCHANGE_RATES_REFRESH_HOURS: ${EXCHANGE_RATES_REFRESH_HOURS:-6}
      EXCEL_SHEET_NAME: ${EXCEL_SHEET_NAME:-Лист1}
      EXCEL_TABLE_NAME: ${EXCEL_TABLE_NAME:-Операции}
      ONEDRIVE_REMOTE: ${ONEDRIVE_REMOTE:-onedrive}
      # Not set: Excel is disabled, expenses are stored in the database only
      ONEDRIVE_FILE_PATH: ${ONEDRIVE_FILE_PATH:-}
      BACKUP_DIR: /data/backups
      # Receipt photos: in the same volume as the rest of the backend data (copied to OneDrive by scripts/backup-receipts.sh)
      RECEIPTS_DIR: /data/receipts
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      # AI receipt parsing (v4). The key is normally entered by the administrator in the app (stored encrypted with
      # SECRETS_KEY); GEMINI_API_KEY is only a fallback. Both can stay empty: the AI is then simply unavailable.
      SECRETS_KEY: ${SECRETS_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      AI_DAILY_LIMIT: ${AI_DAILY_LIMIT:-30}
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-5}
      SYNC_RETRY_SECONDS: ${SYNC_RETRY_SECONDS:-60}
      SYNC_INLINE_WAIT_SECONDS: ${SYNC_INLINE_WAIT_SECONDS:-15}
      SYNC_MAX_DELETE_PERCENT: ${SYNC_MAX_DELETE_PERCENT:-25}
      # App login: users (login:default card) and their passwords. Without a password a user cannot log in
      # (the backend warns in the log). In server mode (docker-compose.public.yml) passwords are required.
      AUTH_USERS: ${AUTH_USERS:-misha:Миша,nastya:Настя}
      # Who can edit and delete records (everyone else is read-only)
      EDITOR_USERS: ${EDITOR_USERS:-misha}
      ADMIN_USERS: ${ADMIN_USERS:-}
      DB_BACKUP_STATUS_DIR: /db-backups
      DEFAULT_GROUP_NAME: ${DEFAULT_GROUP_NAME:-Семья}
      AUTH_PASSWORD_MISHA: ${AUTH_PASSWORD_MISHA:-}
      AUTH_PASSWORD_NASTYA: ${AUTH_PASSWORD_NASTYA:-}
      ACCESS_TOKEN_TTL_HOURS: ${ACCESS_TOKEN_TTL_HOURS:-24}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
      SESSION_MAX_DAYS: ${SESSION_MAX_DAYS:-30}
      # The backend sits behind Caddy: the real IP and HTTPS come from the X-Forwarded-* headers
      TRUST_PROXY: "true"
      AUTH_MIN_PASSWORD_LENGTH: ${AUTH_MIN_PASSWORD_LENGTH:-8}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      CARDS: ${CARDS:-Миша,Настя}
      CATEGORIES: ${CATEGORIES:-кафе,одежда,продукты,жилье,маркетплейс,другое}
    volumes:
      # rclone config (with refreshed tokens) and Excel backups
      - backend-data:/data
      # Status files of the database backup script (read-only): the administrator sees them in the app.
      # On the server set DB_BACKUP_DIR to the folder of the backups (default: ~/backups of scripts/backup-db.sh)
      - ${DB_BACKUP_DIR:-./.db-backups}:/db-backups:ro
    secrets:
      - rclone.conf
    # Not published: reachable only by the web service
    expose:
      - "3000"

  web:
    build:
      context: .
      dockerfile: infra/Dockerfile.frontend
    restart: unless-stopped
    # Memory cap: a leak restarts this container instead of exhausting the server
    mem_limit: 96m
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # For HTTPS on a server, set a domain, e.g. expenses.example.com
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      # While the app has no authorization, the port listens on localhost only
      - "${WEB_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80"
      - "${WEB_BIND:-127.0.0.1}:${HTTPS_PORT:-8443}:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config

secrets:
  rclone.conf:
    file: ./secrets/rclone.conf

volumes:
  pgdata:
  pgadmin-data:
  backend-data:
  caddy-data:
  caddy-config:
